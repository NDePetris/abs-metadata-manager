[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "absmm"
version = "0.1.0"
description = "Approval-gated Audiobookshelf metadata review"
requires-python = ">=3.12"
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1"]

[project.scripts]
absmm = "absmm.cli:main"

[tool.setuptools.packages.find]
include = ["absmm"]

[tool.setuptools.package-data]
absmm = ["review.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
