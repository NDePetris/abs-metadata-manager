[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "abs-metadata-manager"
version = "0.1.0"
description = "Local, approval-gated Audiobookshelf metadata review"
requires-python = ">=3.12"
dependencies = ["streamlit>=1.50,<2", "python-dotenv>=1.1,<2", "requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["abs_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

